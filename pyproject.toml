[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "egasp"
dynamic = ["version"]
authors = [
  { name = "焱铭", email = "lxb-yanming@foxmail.com" },
]
description = "乙二醇水溶液属性查询程序 Ethylene Glycol Aqueous Solution Properties Program"
keywords = ["Ethylene Glycol", "Properties"]
dependencies = [
    "rich>=14.0.0",
    "rich-argparse>=1.7.2",
    "toml>=0.10.2",
    "packaging>=26.3",
    "platformdirs>=4.11.12",
    "numpy>=2.5.3",
]

readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
excel = ["pywin32>=305; sys_platform == 'win32'"]

[project.urls]
"Homepage" = "https://github.com/YanMing-lxb/egasp"
"Bug Tracker" = "https://github.com/YanMing-lxb/egasp/issues"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
publish-url = "https://pypi.org/project/egasp"
default = true

[project.scripts]
egasp = "egasp:main"

[tool.setuptools.dynamic]
version = {attr = "egasp.version.__version__"}

[tool.setuptools.package-data]
"egasp.data" = ["*.py"]
egasp = ["locale/en/LC_MESSAGES/*.mo"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pyyaml>=6.0.3",
    "setuptools>=84.0.0",
]
excel = ["pywin32>=305; sys_platform == 'win32'"]
